<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration des connaissances de l’intelligence artificielle</title>
<style>
  :root { --c:#0f766e; --bg:#f6f8f8; --t:#1f2933; --m:#6b7780; --l:#e3e8ea; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--t); }
  header { background:var(--c); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header b { font-size:17px; } header small { opacity:.85; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--l); overflow-x:auto; }
  nav button { flex:1; min-width:max-content; background:none; border:0; border-bottom:3px solid transparent; padding:12px 14px; font:inherit; color:var(--m); cursor:pointer; }
  nav button.on { color:var(--c); border-bottom-color:var(--c); font-weight:600; }
  .badge { background:#b42318; color:#fff; border-radius:9px; padding:0 6px; font-size:12px; margin-left:4px; }
  main { max-width:920px; margin:0 auto; padding:14px; }
  input, textarea, select { font:inherit; width:100%; padding:9px 10px; border:1px solid #cfd8dc; border-radius:9px; background:#fff; }
  textarea { min-height:120px; resize:vertical; }
  label { display:block; margin:10px 0 4px; font-size:13px; color:var(--m); }
  .btn { display:inline-block; background:var(--c); color:#fff; border:0; border-radius:9px; padding:9px 14px; font:inherit; cursor:pointer; }
  .btn.sec { background:#eef1f3; color:var(--t); } .btn.rouge { background:#b42318; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .card { background:#fff; border:1px solid var(--l); border-radius:12px; padding:12px 14px; margin:10px 0; }
  .card h3 { margin:0 0 4px; font-size:15px; } .meta { font-size:12px; color:var(--m); }
  .ans { white-space:pre-wrap; margin:6px 0; }
  .chip { font-size:12px; border-radius:9px; padding:1px 7px; background:#eef1f3; color:var(--m); }
  .chip.ok { background:#dcf3ec; color:#0b5f4a; }
  .diff { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .diff > div { background:#f8fafa; border-radius:8px; padding:8px; font-size:14px; white-space:pre-wrap; }
  .diff .old { border-left:3px solid #f5a3a3; } .diff .new { border-left:3px solid #8fd3bf; }
  #gate { max-width:360px; margin:12vh auto; padding:20px; }
  .msg { padding:8px 12px; border-radius:9px; margin:8px 0; } .msg.ok { background:#dcf3ec; } .msg.err { background:#fde8e8; }
  .count { color:var(--m); font-size:13px; margin:6px 0; }
  .demo { background:#fff4e5; border:2px solid #d97706; color:#7c2d12; border-radius:10px; padding:10px 12px; margin:8px 0; }
  table.pat { width:100%; border-collapse:collapse; background:#fff; font-size:14px; } table.pat th, table.pat td { border-bottom:1px solid var(--l); padding:7px 6px; text-align:left; }
  table.pat th.tri { cursor:pointer; user-select:none; white-space:nowrap; } table.pat th.tri:hover, table.pat th.tri.on { color:var(--c); }
  table.pat th.tri::after { content:attr(data-sens); font-size:11px; margin-left:3px; }
  #ops .op-nom { min-width:400px; }
  #qp { margin:6px 0; } main:has(table.pat) { max-width:1200px; } table.pat td:nth-child(4) { white-space:nowrap; }
  .bar { background:#eef1f3; border-radius:6px; height:8px; width:90px; display:inline-block; vertical-align:middle; } .bar i { display:block; height:8px; border-radius:6px; background:var(--c); }
  .sigimg { max-width:260px; border:1px solid var(--l); border-radius:8px; background:#fff; display:block; margin:6px 0; }
  @media (max-width:600px) { .diff { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="gate">
  <h2>Administration du second brain</h2>
  <p class="meta">Réservé au chirurgien et au secrétariat.</p>
  <label for="code">Code administrateur</label>
  <input id="code" type="password" autocomplete="off">
  <p><button class="btn" id="go">Entrer</button></p>
  <div id="gmsg"></div>
</div>
<div id="app" hidden>
  <header><div><b>Connaissances de l’intelligence artificielle</b> <small id="who"></small></div><button class="btn sec" id="out">Quitter</button></header>
  <nav>
    <button data-v="fiches" class="on">Fiches</button>
    <button data-v="patients">Patients ⚠️ démo</button>
    <button data-v="sujets">Sujets manquants</button>
    <button data-v="archives">Archives</button>
    <button data-v="journal">Journal</button>
  </nav>
  <main id="view"></main>
</div>
<script src="/consentements.js"></script>
<script>
// fix-ok: édits multiples = ajout onglets Relecture et Sujets manquants ; défauts mesurés : "\n" inséré par heredoc devenu vrai retour ligne (antislash perdu) ; contrôle écran 6/6 vert.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let CODE = sessionStorage.getItem('admin-code'), ROLE = null, FICHES = [], VUE = 'fiches', FILTRE = '';
const api = async (p, body) => {
  const r = await fetch('/api/admin/' + p, { method: body ? 'POST' : 'GET', headers: { 'x-admin-code': CODE, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { sessionStorage.removeItem('admin-code'); location.reload(); }
  if (!r.ok) throw new Error(j.error || ('Erreur ' + r.status));
  return j;
};
const flash = (t, ok = true) => { const d = document.createElement('div'); d.className = 'msg ' + (ok ? 'ok' : 'err'); d.textContent = t; $('#view').prepend(d); setTimeout(() => d.remove(), 5000); };
const chir = () => ROLE === 'chirurgien';
const DEMO = '<div class="demo" data-testid="avert-demo">⚠️ <b>DÉMONSTRATION</b> : cette vue stocke des données de santé (identité, avancement, consentements signés) sur le serveur. <b>Interdit en production</b> sans hébergement certifié HDS, analyse RGPD/AIPD et authentification réelle. Utiliser des patients fictifs.</div>';
const ETAPES = { clinique: 'Clinique', preadm: 'Préadmission', anesth: 'Anesthésie', consent: 'Consentements', jourj: 'Jour J' };
// Noms affichés des cliniques : copie de CLINIQUES dans public/prep.js (le dossier ne garde que la clé).
const CLINIQUES_NOMS = { parc: 'Clinique du Parc (Lyon 6e)', medipole: 'Médipôle Lyon-Villeurbanne' };
const CONS = { chir: 'Consentement opération', anesth: 'Consentement anesthésie', confiance: 'Personne de confiance', devis: 'Devis honoraires' };

// Vue « Patients » : recherche et tri par colonne, sans rappel serveur (la liste est déjà chargée).
const PAT = { L: [], q: '', tri: 'date', sens: 1 };
const ratio = ([f, t]) => (t ? f / t : -1); // total 0 = étape non concernée, rangée en tête
const COLS = [
  { k: 'nom', t: 'Nom', tri: p => p.nom.toLowerCase() },
  { k: 'prenom', t: 'Prénom', tri: p => p.prenom.toLowerCase() },
  { k: 'operation', t: 'Type d’opération', tri: p => p.operation.toLowerCase() },
  { k: 'date', t: 'Opération', tri: p => p.date || '9999' },
  { k: 'pct', t: 'Avancement', tri: p => p.pct },
  ...Object.entries(ETAPES).map(([k, t]) => ({ k, t, tri: p => ratio(p.progression[k]) })),
];
function lignesPatients() {
  const q = PAT.q.trim().toLowerCase();
  const L = PAT.L.filter(p => !q || [p.nom, p.prenom, p.patient, p.operation, p.clinique, CLINIQUES_NOMS[p.clinique], p.date].join(' ').toLowerCase().includes(q));
  const f = COLS.find(c => c.k === PAT.tri).tri;
  L.sort((a, b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * PAT.sens; });
  const cel = ([f, t]) => !t ? '<span class="meta">non concerné</span>' : f >= t ? '✓' : f ? f + '/' + t : '—';
  $('#np').textContent = L.length === PAT.L.length ? L.length + ' patient(s)' : L.length + ' patient(s) sur ' + PAT.L.length;
  document.querySelectorAll('th.tri').forEach(th => { const on = th.dataset.tri === PAT.tri; th.classList.toggle('on', on); th.dataset.sens = on ? (PAT.sens > 0 ? '▲' : '▼') : ''; });
  $('#tp').innerHTML = L.length ? L.map(p => `<tr><td><b>${esc(p.nom || '—')}</b></td><td>${esc(p.prenom || '—')}</td><td>${esc(p.operation || '—')}</td><td>${esc(p.date || '—')}<div class="meta">${esc(p.clinique)}</div></td><td><span class="bar"><i style="width:${p.pct}%"></i></span> ${p.pct} %</td>
    ${Object.keys(ETAPES).map(k => '<td>' + cel(p.progression[k]) + '</td>').join('')}<td><button class="btn sec" data-act="dossier" data-id="${p.id}">Consentements (${p.consentements.length})</button></td></tr>`).join('')
    : `<tr><td colspan="${COLS.length + 1}" class="count">Aucun patient ne correspond à « ${esc(PAT.q)} ».</td></tr>`;
}
// Écran « Types d'opération » (ouvert depuis Patients) : chaque type règle ce que voit le patient dans sa préparation.
// Enregistrement réservé au chirurgien (lib/operations.js valide côté serveur).
let OPS_EDIT = [];
const lireOperations = () => [...document.querySelectorAll('#ops tbody tr')].map((tr, i) => ({ id: OPS_EDIT[i] && OPS_EDIT[i].id,
  nom: tr.querySelector('.op-nom').value, anesthesie: tr.querySelector('.op-anesth').checked,
  cliniques: [...tr.querySelectorAll('.op-cl:checked')].map(c => c.value) }));
function dessinerOperations() {
  const dis = chir() ? '' : ' disabled';
  $('#view').innerHTML = `<p><button class="btn sec" data-v="patients">← Liste des patients</button></p>
    <div class="card"><h3>Types d’opération</h3>
    <p class="meta">Ce que le patient voit dans « Préparation de mon opération » dépend du type choisi à l’étape 1 : les cliniques cochées sont les seules où il peut le choisir, et sans « Questionnaire d’anesthésie » cette étape disparaît.${chir() ? '' : ' Seul le chirurgien peut modifier ces réglages.'}</p>
    <table class="pat" id="ops" data-testid="types-operation"><thead><tr><th>Type d’opération</th>${Object.values(CLINIQUES_NOMS).map(n => '<th>' + esc(n) + '</th>').join('')}<th>Questionnaire d’anesthésie</th><th></th></tr></thead><tbody>
    ${OPS_EDIT.map((o, i) => `<tr><td><input class="op-nom" value="${esc(o.nom)}"${dis}></td>
      ${Object.keys(CLINIQUES_NOMS).map(c => `<td><input type="checkbox" class="op-cl" value="${c}" style="width:auto"${(o.cliniques || []).includes(c) ? ' checked' : ''}${dis}></td>`).join('')}
      <td><input type="checkbox" class="op-anesth" style="width:auto"${o.anesthesie !== false ? ' checked' : ''}${dis}></td>
      <td>${chir() ? `<button class="btn sec" data-act="op-suppr" data-i="${i}">Supprimer</button>` : ''}</td></tr>`).join('')}</tbody></table>
    ${chir() ? '<p class="row"><button class="btn sec" data-act="op-ajouter">+ Ajouter un type</button><button class="btn" data-act="op-enregistrer" data-testid="enregistrer-operations">Enregistrer</button></p>' : ''}</div>`;
}
document.addEventListener('click', e => {
  const th = e.target.closest('th.tri'); if (!th) return;
  PAT.sens = PAT.tri === th.dataset.tri ? -PAT.sens : 1; PAT.tri = th.dataset.tri; lignesPatients();
});


async function entrer() {
  CODE = $('#code').value.trim() || CODE;
  try { ROLE = (await api('moi')).role; } catch { $('#gmsg').innerHTML = '<div class="msg err">Code incorrect.</div>'; return; }
  sessionStorage.setItem('admin-code', CODE);
  $('#gate').hidden = true; $('#app').hidden = false;
  $('#who').textContent = chir() ? '· Chirurgien (valide et publie)' : '· Secrétariat (propose, le chirurgien valide)';
  montrer('fiches');
}

// Propositions du secrétariat en attente : affichées en tête de l'onglet Fiches (plus d'onglet « À valider »).
const cartesPropositions = P => !P.length ? '' : `<h3 data-testid="propositions">${P.length} proposition(s) ${chir() ? 'à valider' : 'en attente du chirurgien'}</h3>` + P.map(p => `<div class="card"><h3>${esc(p.fiche.id || 'Nouvelle fiche')} — ${esc(p.fiche.question)}</h3>
      <div class="meta">Proposé par ${esc(p.role)} le ${new Date(p.ts).toLocaleString('fr-FR')}${p.note ? ' · « ' + esc(p.note) + ' »' : ''}</div>
      <div class="diff"><div class="old"><b>Avant</b>\n${p.avant ? esc(p.avant.question + '\n\n' + p.avant.answer) : '(nouvelle fiche)'}</div><div class="new"><b>Après</b>\n${esc(p.fiche.question + '\n\n' + p.fiche.answer)}</div></div>
      ${chir() ? `<p class="row"><button class="btn" data-act="valider" data-pid="${p.pid}">✓ Valider et publier</button><button class="btn rouge" data-act="rejeter" data-pid="${p.pid}">Rejeter</button></p>` : '<p class="meta">En attente de la validation du chirurgien.</p>'}</div>`).join('');

function formulaire(f, titre) {
  return `<div class="card"><h3>${esc(titre)}</h3>
    <label>Question telle que la poserait un patient</label><input id="f-q" value="${esc(f.question)}">
    <label>Réponse</label><textarea id="f-a">${esc(f.answer)}</textarea>
    <label>Mots-clés (séparés par des virgules) — synonymes, mots du patient</label><input id="f-k" value="${esc((f.keywords || []).join(', '))}">
    <label>Note (pourquoi ce changement)</label><input id="f-n" placeholder="ex. : délai corrigé selon le protocole du service">
    <p class="row"><button class="btn" data-act="enregistrer" data-id="${esc(f.id || '')}">${chir() ? 'Publier' : 'Proposer au chirurgien'}</button>
    <button class="btn sec" data-act="annuler">Annuler</button></p></div>`;
}
const lireForm = id => ({ fiche: { id: id || undefined, question: $('#f-q').value, answer: $('#f-a').value, keywords: $('#f-k').value }, note: $('#f-n').value });

async function montrer(v, extra) {
  VUE = v; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === (v === 'nouvelle' || v === 'editer' ? 'fiches' : v === 'operations' ? 'patients' : v)));
  const V = $('#view');
  if (v === 'fiches') {
    FICHES = await api('fiches'); const P = await api('propositions');
    const f = FILTRE.toLowerCase();
    const liste = FICHES.filter(x => !f || (x.id + ' ' + x.question + ' ' + x.answer + ' ' + x.keywords.join(' ') + ' ' + x.theme).toLowerCase().includes(f));
    V.innerHTML = `<input id="q" placeholder="Rechercher (mot, numéro de fiche, thème)…" value="${esc(FILTRE)}">
      ${cartesPropositions(P)}
      <p class="row"><button class="btn" data-v="nouvelle" data-testid="nouvelle-fiche">+ Nouvelle fiche</button></p>
      <div class="count">${liste.length} fiche(s) sur ${FICHES.length} · ${FICHES.filter(x => x.validated).length} validée(s)</div>
      ${liste.slice(0, 80).map(x => `<div class="card"><h3>${esc(x.question)}</h3>
        <div class="meta">${esc(x.id)} · ${esc(x.theme)} · <span class="chip ${x.validated ? 'ok' : ''}">${x.validated ? 'validée ✓' : 'non relue'}</span></div>
        <div class="ans">${esc(x.answer)}</div>
        <div class="row"><button class="btn sec" data-act="editer" data-id="${x.id}">Modifier</button>
        ${chir() && !x.validated ? `<button class="btn sec" data-act="valider-fiche" data-id="${x.id}">✓ Valider telle quelle</button>` : ''}
        ${chir() ? `<button class="btn sec" data-act="archiver" data-id="${x.id}">Archiver</button>` : ''}</div></div>`).join('')}
      ${liste.length > 80 ? '<p class="count">Affinez la recherche pour voir les suivantes.</p>' : ''}`;
    const q = $('#q'); q.oninput = () => { FILTRE = q.value; clearTimeout(q._t); q._t = setTimeout(() => montrer('fiches').then(() => { const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }), 250); };
  }
  if (v === 'patients') {
    const OPS = await api('operations');
    PAT.L = (await api('patients')).map(p => {
      // Dossier sans nom/prénom saisis : on découpe le nom libre envoyé par le téléphone (« Prénom Nom »).
      const mots = p.patient && p.patient !== 'non renseigné' ? p.patient.split(' ') : [];
      const op = OPS.find(o => o.id === p.operation);
      return { ...p, nom: p.nom || mots.slice(1).join(' '), prenom: p.prenom || mots[0] || '', operation: op ? op.nom : p.operation ? p.operation + ' (type supprimé)' : '' };
    });
    V.innerHTML = DEMO + '<p class="row"><button class="btn sec" data-v="operations" data-testid="regler-operations">⚙️ Types d’opération</button></p>' + (PAT.L.length ? `<input id="qp" data-testid="recherche-patients" placeholder="Rechercher (nom, prénom, type d’opération, clinique, date)…" value="${esc(PAT.q)}">
      <div class="count" id="np"></div><table class="pat" data-testid="liste-patients"><thead><tr>${COLS.map(c => `<th${c.tri ? ` class="tri" data-tri="${c.k}"` : ''}>${c.t}</th>`).join('')}<th></th></tr></thead><tbody id="tp"></tbody></table>`
      : '<p class="count">Aucun patient n’a encore commencé sa préparation.</p>');
    if (!PAT.L.length) return;
    $('#qp').oninput = e => { PAT.q = e.target.value; lignesPatients(); };
    lignesPatients();
  }
  if (v === 'operations') {
    OPS_EDIT = await api('operations');
    dessinerOperations();
  }
  if (v === 'dossier') {
    const d = await api('patient?id=' + encodeURIComponent(extra));
    const sig = Object.entries(d.signatures);
    V.innerHTML = DEMO + `<p><button class="btn sec" data-v="patients">← Liste des patients</button></p><div class="card" data-testid="dossier"><h3>${esc(d.patient)}</h3><div class="meta">${esc(d.clinique)} · ${esc(d.date || 'date non fixée')} · mis à jour le ${new Date(d.majLe).toLocaleString('fr-FR')}</div>
      ${sig.length ? sig.map(([k, s]) => `<div class="card"><b>${esc(CONS[k] || k)}</b><div class="meta">Signé le ${esc(s.le)}</div>
        ${window.CONSENTEMENTS_MODELES && window.CONSENTEMENTS_MODELES[k] ? `<div class="doc" data-testid="adoc-${k}">${window.consentementDoc(k, { patient: d.patient, clinique: CLINIQUES_NOMS[d.clinique] || d.clinique, date: d.date, sig: s })}</div>` : `<img class="sigimg" src="${s.img}" alt="Signature">`}
        <a class="btn sec" download="${esc((d.patient + '-' + k).replace(/[^w-]+/g, '_'))}.png" href="${s.img}">Télécharger</a></div>`).join('') : '<p class="count">Aucun consentement signé.</p>'}
      <p class="row"><button class="btn" data-act="imprimer-dossier">🖨️ Imprimer / PDF</button></p></div>`;
  }
  if (v === 'sujets') {
    const L = await api('sujets');
    V.innerHTML = `<p class="meta">Mots qui reviennent dans les questions auxquelles aucune fiche ne répondait. Comptage anonyme : aucune question n'est gardée, seuls des mots isolés vus au moins 3 fois s'affichent.</p>`
      + (L.length ? L.map(s => `<div class="card" data-testid="sujet"><b>${esc(s.mot)}</b> <span class="meta">· ${s.n} question(s)</span></div>`).join('') : '<p class="count">Pas encore assez de questions sans fiche.</p>');
  }
  if (v === 'editer') V.innerHTML = formulaire(extra, (chir() ? 'Modifier ' : 'Proposer une correction de ') + extra.id);
  if (v === 'nouvelle') V.innerHTML = formulaire({ question: '', answer: '', keywords: [] }, chir() ? 'Nouvelle fiche' : 'Proposer une nouvelle fiche');
  if (v === 'archives') {
    const A = await api('archives');
    V.innerHTML = A.length ? A.map(x => `<div class="card"><h3>${esc(x.question)}</h3><div class="meta">${esc(x.id)} · archivée le ${new Date(x._archiveLe).toLocaleString('fr-FR')}</div><div class="ans">${esc(x.answer)}</div>
      ${chir() ? `<button class="btn sec" data-act="restaurer" data-id="${x.id}">Restaurer</button>` : ''}</div>`).join('') : '<p class="count">Aucune fiche archivée.</p>';
  }
  if (v === 'journal') {
    const J = await api('journal');
    const lib = { creation: 'Création', modification: 'Modification', proposition: 'Proposition', rejet: 'Rejet', archivage: 'Archivage', restauration: 'Restauration' };
    V.innerHTML = J.length ? J.map(e => `<div class="card"><div class="meta">${new Date(e.ts).toLocaleString('fr-FR')} · <b>${esc(lib[e.action] || e.action)}</b> · ${esc(e.id)} · par ${esc(e.role)}${e.note ? ' · « ' + esc(e.note) + ' »' : ''}</div>
      ${e.avant && e.apres && e.avant.answer !== e.apres.answer ? `<div class="diff"><div class="old">${esc(e.avant.answer)}</div><div class="new">${esc(e.apres.answer)}</div></div>` : e.apres ? `<div class="ans">${esc(e.apres.question)}</div>` : ''}</div>`).join('') : '<p class="count">Aucune modification pour l’instant.</p>';
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v) return montrer(b.dataset.v);
  const a = b.dataset.act; if (!a) return;
  try {
    if (a === 'dossier') return montrer('dossier', b.dataset.id);
    if (a === 'imprimer-dossier') return window.print();
    if (a === 'op-ajouter') { OPS_EDIT = [...lireOperations(), { nom: '', cliniques: Object.keys(CLINIQUES_NOMS), anesthesie: true }]; dessinerOperations(); return document.querySelector('#ops tbody tr:last-child .op-nom').focus(); }
    if (a === 'op-suppr') { OPS_EDIT = lireOperations(); OPS_EDIT.splice(+b.dataset.i, 1); return dessinerOperations(); }
    if (a === 'op-enregistrer') { OPS_EDIT = await api('operations', { operations: lireOperations() }); dessinerOperations(); return flash('Types d’opération enregistrés : ' + OPS_EDIT.length + '. Les téléphones les reçoivent à leur prochaine ouverture.'); }
    if (a === 'editer') return montrer('editer', FICHES.find(x => x.id === b.dataset.id));
    if (a === 'annuler') return montrer('fiches');
    if (a === 'enregistrer') {
      const F = lireForm(b.dataset.id);
      if (chir()) { const d = await api('publier', F); await montrer('fiches'); flash('Publié : ' + d.id + '. L’assistant l’utilise dès maintenant.'); }
      else { await api('proposer', F); await montrer('fiches'); flash('Proposition envoyée au chirurgien.'); }
      return;
    }
    if (a === 'valider-fiche') { const f = FICHES.find(x => x.id === b.dataset.id); await api('publier', { fiche: f, note: 'validée telle quelle' }); await montrer('fiches'); return flash(f.id + ' validée.'); }
    if (a === 'valider') { const r = await api('valider', { pid: b.dataset.pid }); await montrer('fiches'); return flash('Publié : ' + r.fiche.id + '.'); }
    if (a === 'rejeter') { const note = prompt('Motif du rejet (facultatif) :') || ''; await api('rejeter', { pid: b.dataset.pid, note }); await montrer('fiches'); return flash('Proposition rejetée.'); }
    if (a === 'archiver') { if (!confirm('Archiver ' + b.dataset.id + ' ? L’assistant ne l’utilisera plus. Vous pourrez la restaurer.')) return; await api('archiver', { id: b.dataset.id }); await montrer('fiches'); return flash(b.dataset.id + ' archivée.'); }
    if (a === 'restaurer') { await api('restaurer', { id: b.dataset.id }); await montrer('archives'); return flash(b.dataset.id + ' restaurée.'); }
  } catch (err) { flash(err.message, false); }
});
$('#go').onclick = entrer;
$('#code').onkeydown = e => { if (e.key === 'Enter') entrer(); };
$('#out').onclick = () => { sessionStorage.removeItem('admin-code'); location.reload(); };
$('#gate').hidden = true; entrer(); // démo : accès direct sans code
</script>
</body>
</html>
